services:

  postgres:
    image: postgres:16-alpine
    container_name: axiaops-postgres
    environment:
      POSTGRES_DB: axiaops
      POSTGRES_USER: axiaops_owner
      POSTGRES_PASSWORD: axiaops_owner
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiaops_owner -d axiaops"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: axiaops-ingestion
    env_file:
      - ./services/ingestion/.env
    environment:
      DATABASE_URL: postgres://axiaops:axiaops@postgres:5432/axiaops
      MIGRATION_DATABASE_URL: postgres://axiaops_owner:axiaops_owner@postgres:5432/axiaops
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: axiaops-api
    env_file:
      - ./services/api/.env
    environment:
      DATABASE_URL: postgres://axiaops:axiaops@postgres:5432/axiaops
      MIGRATION_DATABASE_URL: postgres://axiaops_owner:axiaops_owner@postgres:5432/axiaops
      INGESTION_URL: http://ingestion:8081
      API_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_KINDE_ISSUER: ${EXPO_PUBLIC_KINDE_ISSUER:-https://axiaops.kinde.com}
        EXPO_PUBLIC_KINDE_CLIENT_ID: ${EXPO_PUBLIC_KINDE_CLIENT_ID:-7e07b95e4d2c45afad5f88a0fa8ebcba}
        EXPO_PUBLIC_API_URL: /api
    container_name: axiaops-dashboard
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy
