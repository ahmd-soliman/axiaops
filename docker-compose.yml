services:

  redis:
    image: valkey/valkey:8.1-alpine
    container_name: axiaops-valkey
    # requirepass closes the intra-LAN trust gap flagged in §12 Q7 of
    # docs/c1-hmac-plan.md: any process on the docker network could
    # otherwise LPUSH a forged scan job. Empty REDIS_PASSWORD ⇒ no
    # password (local-dev convenience); deployed envs always set it.
    command:
      - valkey-server
      - --requirepass
      - ${REDIS_PASSWORD:-}
    healthcheck:
      # -a + --no-auth-warning makes valkey-cli send AUTH when a password is
      # set AND stays silent on the (NOAUTH) startup warning. Works against
      # both empty and configured REDIS_PASSWORD.
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

  postgres:
    image: postgres:17.5-alpine
    container_name: axiaops-postgres
    environment:
      POSTGRES_DB: axiaops
      POSTGRES_USER: axiaops_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-axiaops_owner}
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiaops_owner -d axiaops"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: axiaops-ingestion
    env_file:
      - ./services/ingestion/.env
    environment:
      DATABASE_URL: postgres://axiaops:${POSTGRES_PASSWORD:-axiaops}@postgres:5432/axiaops
      # Runtime RLS-bypass role (axiaops_runtime) — replaces the schema-owner
      # connection at runtime; the migrate step (scripts/migrate.sh, run by the
      # `migrate` Make target before this stack starts) bootstraps the role.
      # See docs/AUTHENTICATION.md (§5).
      RUNTIME_ADMIN_DATABASE_URL: postgres://axiaops_runtime:${POSTGRES_RUNTIME_PASSWORD:-axiaops_runtime}@postgres:5432/axiaops
      # Dev mode defaults — overridable by .env or explicit env vars
      DEV_MODE: ${DEV_MODE:-true}
      DEV_ORGANIZATION_ID: ${DEV_ORGANIZATION_ID:-dev-organization-axiaops}
      # Required. Source from services/ingestion/.env or the shell. No fallback
      # by design — a committed default would let any repo-reader decrypt the
      # accounts.secret_encrypted column on any host that ran with the default.
      # Generate with: openssl rand -hex 32
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Text logs by default for human-readable container output. After 8cbf35a
      # logging.go no longer infers text from DEV_MODE — set LOG_OUTPUT here
      # so `make start-staging` and debugger-attached profiles get text logs
      # like the host-mode `make start-dev` flow does (via scripts/start.sh).
      # Override to `json` for parity with deployed envs.
      LOG_OUTPUT: ${LOG_OUTPUT:-text}
      # REDIS_URL carries the password in userinfo form when
      # REDIS_PASSWORD is set: redis://:<pw>@host:port. redis.ParseURL on
      # the Go side handles the userinfo parse. Empty REDIS_PASSWORD falls
      # back to the unauthenticated default — fine for local dev.
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-}@redis:6379}
      # C-1: shared-secret HMAC for the api → ingestion hop. Empty default
      # is intentional — DEV_MODE bypasses HMAC verification. Production
      # deploys MUST set this (see deploy/*.yml). Optional `_NEXT` slot
      # supports zero-downtime rotation on the verifier side only.
      INGESTION_SHARED_SECRET: ${INGESTION_SHARED_SECRET:-}
      INGESTION_SHARED_SECRET_NEXT: ${INGESTION_SHARED_SECRET_NEXT:-}
      INGESTION_HMAC_SOFT_ENFORCE: ${INGESTION_HMAC_SOFT_ENFORCE:-false}
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: axiaops-api
    env_file:
      - ./services/api/.env
    environment:
      DATABASE_URL: postgres://axiaops:${POSTGRES_PASSWORD:-axiaops}@postgres:5432/axiaops
      # Runtime RLS-bypass role (axiaops_runtime) — see the ingestion service
      # above and docs/AUTHENTICATION.md (§5).
      RUNTIME_ADMIN_DATABASE_URL: postgres://axiaops_runtime:${POSTGRES_RUNTIME_PASSWORD:-axiaops_runtime}@postgres:5432/axiaops
      INGESTION_URL: http://ingestion:8081
      API_ADDR: ":8080"
      # PUBLIC_HOST — externally-reachable origin used to build the OIDC
      # redirect_uri the IdP sees. Without it the api logs a startup ERROR
      # and Keycloak/Entra/etc. reject the ceremony with
      # "Invalid parameter: redirect_uri". Default matches the dashboard's
      # host port (see dashboard.ports below); override per-host (LAN IP,
      # mDNS hostname, etc.) when running SSO tests against a Keycloak that
      # only knows the absolute browser-reachable URL.
      PUBLIC_HOST: ${PUBLIC_HOST:-http://localhost:8082}
      # Dev mode defaults — overridable by .env or explicit env vars
      DEV_MODE: ${DEV_MODE:-true}
      DEV_ORGANIZATION_ID: ${DEV_ORGANIZATION_ID:-dev-organization-axiaops}
      # Required. See ingestion service above for rationale. Generate with:
      # openssl rand -hex 32
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # See ingestion service above for rationale.
      LOG_OUTPUT: ${LOG_OUTPUT:-text}
      # REDIS_URL carries the password — see ingestion service comment.
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-}@redis:6379}
      # C-1: shared-secret HMAC for outbound api → ingestion calls. Same
      # value as the ingestion side (the api signs with current; rotation
      # is verifier-side only). Empty default ⇒ DEV_MODE no-sign.
      INGESTION_SHARED_SECRET: ${INGESTION_SHARED_SECRET:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ingestion:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_DEV_MODE: ${DEV_MODE:-true}
        VITE_AXIAOPS_AWS_ACCOUNT_ID: ${AXIAOPS_AWS_ACCOUNT_ID:-}
    # Runtime env consumed by inject-env.sh (writes window.__ENV__ on
    # container start) so the dashboard's runtime config can be tweaked
    # without rebuilding the bundle.
    environment:
      DEV_MODE: ${DEV_MODE:-true}
      DEV_ORG_NAME: ${DEV_ORG_NAME:-AxiaOps Dev}
      AXIAOPS_AWS_ACCOUNT_ID: ${AXIAOPS_AWS_ACCOUNT_ID:-}
    container_name: axiaops-dashboard
    ports:
      # Plain HTTP only. TLS termination is the edge proxy's job in every
      # real deployment (CloudFront, on-prem reverse proxy); this local
      # stack mirrors the post-edge plain-HTTP shape. See nginx.conf for
      # the cookie posture under direct-port access.
      - "8082:80"
    depends_on:
      api:
        condition: service_healthy
