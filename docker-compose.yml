services:

  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: axiaops-ingestion
    env_file:
      - ./services/ingestion/.env
    environment:
      DB_PATH: /data/axiaops.db
      API_ADDR: ":8080"
      USAGE_PATH: fixtures/usage.json
    volumes:
      - ./services/ingestion/fixtures:/app/fixtures:ro
      - db_data:/data
      - ${HOME}/.aws:/root/.aws:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_KINDE_ISSUER: ${EXPO_PUBLIC_KINDE_ISSUER:-https://axiaops.kinde.com}
        EXPO_PUBLIC_KINDE_CLIENT_ID: ${EXPO_PUBLIC_KINDE_CLIENT_ID:-7e07b95e4d2c45afad5f88a0fa8ebcba}
        EXPO_PUBLIC_API_URL: /api
    container_name: axiaops-dashboard
    ports:
      - "8081:80"
    depends_on:
      ingestion:
        condition: service_healthy

volumes:
  db_data:
