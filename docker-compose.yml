services:

  redis:
    image: redis:7-alpine
    container_name: axiaops-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: axiaops-postgres
    environment:
      POSTGRES_DB: axiaops
      POSTGRES_USER: axiaops_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-axiaops_owner}
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiaops_owner -d axiaops"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: axiaops-ingestion
    env_file:
      - ./services/ingestion/.env
    environment:
      DATABASE_URL: postgres://axiaops:${POSTGRES_PASSWORD:-axiaops}@postgres:5432/axiaops
      MIGRATION_DATABASE_URL: postgres://axiaops_owner:${POSTGRES_OWNER_PASSWORD:-axiaops_owner}@postgres:5432/axiaops
      # Dev mode defaults — overridable by .env or explicit env vars
      DEV_MODE: ${DEV_MODE:-true}
      DEV_TENANT_ID: ${DEV_TENANT_ID:-dev-tenant-axiaops}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-5f67e3efd16e96eee4afd01d27d98e1f1a11aa226312d0147ff566108ee8819a}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: axiaops-api
    env_file:
      - ./services/api/.env
    environment:
      DATABASE_URL: postgres://axiaops:${POSTGRES_PASSWORD:-axiaops}@postgres:5432/axiaops
      MIGRATION_DATABASE_URL: postgres://axiaops_owner:${POSTGRES_OWNER_PASSWORD:-axiaops_owner}@postgres:5432/axiaops
      INGESTION_URL: http://ingestion:8081
      API_ADDR: ":8080"
      # Dev mode defaults — overridable by .env or explicit env vars
      DEV_MODE: ${DEV_MODE:-true}
      DEV_TENANT_ID: ${DEV_TENANT_ID:-dev-tenant-axiaops}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-5f67e3efd16e96eee4afd01d27d98e1f1a11aa226312d0147ff566108ee8819a}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ingestion:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
      args:
        VITE_KINDE_ISSUER: ${VITE_KINDE_ISSUER:-https://axiaops.kinde.com}
        VITE_KINDE_CLIENT_ID: ${VITE_KINDE_CLIENT_ID:-7e07b95e4d2c45afad5f88a0fa8ebcba}
        VITE_API_URL: /api
        VITE_DEV_MODE: ${DEV_MODE:-true}
    container_name: axiaops-dashboard
    ports:
      - "8082:80"
    depends_on:
      api:
        condition: service_healthy
