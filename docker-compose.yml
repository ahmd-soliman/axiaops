services:

  redis:
    image: redis:7-alpine
    container_name: axiaops-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: axiaops-postgres
    environment:
      POSTGRES_DB: axiaops
      POSTGRES_USER: axiaops_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-axiaops_owner}
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiaops_owner -d axiaops"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: axiaops-ingestion
    env_file:
      - ./services/ingestion/.env
    environment:
      DATABASE_URL: postgres://axiaops:${POSTGRES_PASSWORD:-axiaops}@postgres:5432/axiaops
      MIGRATION_DATABASE_URL: postgres://axiaops_owner:${POSTGRES_OWNER_PASSWORD:-axiaops_owner}@postgres:5432/axiaops
      # Dev mode defaults — overridable by .env or explicit env vars
      DEV_MODE: ${DEV_MODE:-true}
      DEV_ORGANIZATION_ID: ${DEV_ORGANIZATION_ID:-dev-organization-axiaops}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-5f67e3efd16e96eee4afd01d27d98e1f1a11aa226312d0147ff566108ee8819a}
      # Text logs by default for human-readable container output. After 8cbf35a
      # logging.go no longer infers text from DEV_MODE — set LOG_OUTPUT here
      # so `make start-staging` and debugger-attached profiles get text logs
      # like the host-mode `make start-dev` flow does (via scripts/start.sh).
      # Override to `json` for parity with deployed envs.
      LOG_OUTPUT: ${LOG_OUTPUT:-text}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: axiaops-api
    env_file:
      - ./services/api/.env
    environment:
      DATABASE_URL: postgres://axiaops:${POSTGRES_PASSWORD:-axiaops}@postgres:5432/axiaops
      MIGRATION_DATABASE_URL: postgres://axiaops_owner:${POSTGRES_OWNER_PASSWORD:-axiaops_owner}@postgres:5432/axiaops
      INGESTION_URL: http://ingestion:8081
      API_ADDR: ":8080"
      # PUBLIC_HOST — externally-reachable origin used to build the OIDC
      # redirect_uri the IdP sees. Without it the api logs a startup ERROR
      # and Keycloak/Entra/etc. reject the ceremony with
      # "Invalid parameter: redirect_uri". Default matches the dashboard's
      # host port (see dashboard.ports below); override per-host (LAN IP,
      # mDNS hostname, etc.) when running SSO tests against a Keycloak that
      # only knows the absolute browser-reachable URL.
      PUBLIC_HOST: ${PUBLIC_HOST:-http://localhost:8082}
      # Dev mode defaults — overridable by .env or explicit env vars
      DEV_MODE: ${DEV_MODE:-true}
      DEV_ORGANIZATION_ID: ${DEV_ORGANIZATION_ID:-dev-organization-axiaops}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-5f67e3efd16e96eee4afd01d27d98e1f1a11aa226312d0147ff566108ee8819a}
      # See ingestion service above for rationale.
      LOG_OUTPUT: ${LOG_OUTPUT:-text}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Kinde Management API — set M2M creds for real invitation emails and
      # outbound org rename. For local staging without a real M2M app set
      # KINDE_USE_STUB=true (defaults to true here so `make start-staging`
      # works out of the box). Set to false (and provide M2M creds) for prod.
      KINDE_ISSUER: ${KINDE_ISSUER:-https://axiaops.kinde.com}
      KINDE_M2M_CLIENT_ID: ${KINDE_M2M_CLIENT_ID:-}
      KINDE_M2M_CLIENT_SECRET: ${KINDE_M2M_CLIENT_SECRET:-}
      KINDE_USE_STUB: ${KINDE_USE_STUB:-true}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ingestion:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
      args:
        VITE_KINDE_ISSUER: ${VITE_KINDE_ISSUER:-https://axiaops.kinde.com}
        VITE_KINDE_CLIENT_ID: ${VITE_KINDE_CLIENT_ID:-9fc9d3b7d0024947bd3c9fa253dfd28c}
        VITE_API_URL: /api
        VITE_DEV_MODE: ${DEV_MODE:-true}
        VITE_FEATURE_ROLE_AUTH: ${FEATURE_ROLE_AUTH:-false}
        VITE_AXIAOPS_AWS_ACCOUNT_ID: ${AXIAOPS_AWS_ACCOUNT_ID:-}
    # Runtime env consumed by inject-env.sh (writes window.__ENV__ on
    # container start). Without this block, KINDE_ISSUER / KINDE_CLIENT_ID
    # are empty strings, the Kinde SDK rejects with "Please supply a valid
    # Kinde domain", and login fails before redirecting.
    environment:
      DEV_MODE: ${DEV_MODE:-true}
      KINDE_ISSUER: ${VITE_KINDE_ISSUER:-https://axiaops.kinde.com}
      KINDE_CLIENT_ID: ${VITE_KINDE_CLIENT_ID:-9fc9d3b7d0024947bd3c9fa253dfd28c}
      DEV_ORG_NAME: ${DEV_ORG_NAME:-AxiaOps Dev}
      FEATURE_ROLE_AUTH: ${FEATURE_ROLE_AUTH:-false}
      AXIAOPS_AWS_ACCOUNT_ID: ${AXIAOPS_AWS_ACCOUNT_ID:-}
    container_name: axiaops-dashboard
    ports:
      # Plain HTTP only. TLS termination is the edge proxy's job in every
      # real deployment (App Runner, on-prem reverse proxy); this local
      # stack mirrors the post-edge plain-HTTP shape. See nginx.conf for
      # the cookie posture under direct-port access.
      - "8082:80"
    depends_on:
      api:
        condition: service_healthy
