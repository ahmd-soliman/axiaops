services:

  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: axiaops-ingestion
    environment:
      DEV_MODE: "true"
      FIXTURE_PATH: fixtures/costs.json
      USAGE_PATH: fixtures/usage.json
      DB_PATH: /data/axiaops.db
      API_ADDR: ":8080"
    volumes:
      - ./services/ingestion/fixtures:/app/fixtures:ro
      - db_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/summary || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
    container_name: axiaops-dashboard
    ports:
      - "8081:80"
    depends_on:
      ingestion:
        condition: service_healthy

volumes:
  db_data:
