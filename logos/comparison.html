<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AxiaOps logo — wordmark weight 500 vs 600</title>
  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-panel-light: #ffffff;
      --bg-panel-dark: #0B1220;
      --border: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 48px 64px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
    }
    h1 {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.5px;
      margin: 0 0 8px 0;
    }
    p.intro {
      color: var(--text-secondary);
      margin: 0 0 40px 0;
      max-width: 720px;
      line-height: 1.55;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }
    .label {
      font-size: 11px;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .panel {
      padding: 64px 48px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 320px;
    }
    .panel.light { background: var(--bg-panel-light); border: 1px solid var(--border); }
    .panel.dark  { background: var(--bg-panel-dark); }
    .logo {
      width: 100%;
      max-width: 520px;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <h1>AxiaOps wordmark — 500 (medium) vs 600 (semibold)</h1>
  <p class="intro">Same cube, same large cutout, same cubies. The only thing that changes is the wordmark's font-weight: left is current production at 500, right is 600.</p>

            <polygon points="-33,-20 0,-1 0,36 -33,18" fill="#9a3412"/>

            <polygon points="0,-38 16.5,-29 0,-20 16.5,-10.5 0,-1 -33,-20" fill="#fb923c"/>
            <g transform="translate(40 -25)" opacity="0.9"><polygon points="0,-7 6,-3.5 0,0 -6,-3.5" fill="#fb923c"/><polygon points="0,0 6,-3.5 6,3.5 0,7" fill="#ea580c"/><polygon points="0,0 -6,-3.5 -6,3.5 0,7" fill="#9a3412"/></g>

            <g transform="translate(38 -52)" opacity="0.45"><polygon points="0,-3.5 3,-1.75 0,0 -3,-1.75" fill="#fb923c"/><polygon points="0,0 3,-1.75 3,1.75 0,3.5" fill="#ea580c"/><polygon points="0,0 -3,-1.75 -3,1.75 0,3.5" fill="#9a3412"/></g>
            <g transform="translate(64 -45)" opacity="0.32"><polygon points="0,-3 2.6,-1.5 0,0 -2.6,-1.5" fill="#fb923c"/><polygon points="0,0 2.6,-1.5 2.6,1.5 0,3" fill="#ea580c"/><polygon points="0,0 -2.6,-1.5 -2.6,1.5 0,3" fill="#9a3412"/></g>

        </svg>
      </div>
    </div>

    </div>
  </div>
