# Admin-plane UI — HTTP-only; TLS termination is the edge proxy's job (an edge proxy at
# admin.axiaops-<env>.example.com terminates TLS, forwards plain HTTP here on
# :80). Mirrors services/dashboard/nginx.conf, adapted for the staff console:
#  - proxies /admin/* (NOT /api/*) to the api-admin backend, with NO path
#    rewrite (the backend routes are literally /admin/*).
#  - same-origin so the SameSite=Lax axiaops_staff_session cookie round-trips
#    with credentials:'include' and no CORS plumbing.
#  - X-Forwarded-Proto is propagated (not hardcoded): internal/staff/session.go
#    derives the cookie's Secure flag from it.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Real-client-IP recovery behind the trusted proxy chain (an edge proxy → this
    # nginx → api-admin). Same trust boundary as the tenant dashboard.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    set_real_ip_from  127.0.0.1/32;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Security headers — `always` so 4xx/5xx carry them too. CSP keeps scripts
    # to self (the admin Vite bundle loads no remote scripts).
    add_header X-Content-Type-Options "nosniff"                                                                            always;
    add_header Permissions-Policy   "geolocation=(), camera=(), microphone=(), payment=()"                                  always;
    add_header X-Frame-Options        "DENY"                                                                               always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"                                                    always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"                                             always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Serve the SPA — all routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # theme-boot.js is the un-fingerprinted synchronous theme IIFE — never
    # cache it (a stale copy runs old logic after a redeploy). Any add_header
    # here discards inherited ones, so repeat the security headers.
    location = /theme-boot.js {
        add_header X-Content-Type-Options "nosniff"                                                                            always;
        add_header Permissions-Policy   "geolocation=(), camera=(), microphone=(), payment=()"                                  always;
        add_header X-Frame-Options        "DENY"                                                                               always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"                                                    always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"                                             always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control          "no-store"                                                                            always;
    }

    # Block external scrapes of the admin /metrics — it carries cross-tenant
    # labels. Internal collectors hit api-admin:8080/metrics directly via
    # container DNS. Exact-match beats the /admin/ prefix below.
    location = /admin/metrics {
        return 404;
    }

    # Proxy staff-console API calls to api-admin. ADMIN_API_HOST is substituted
    # at container start by inject-env.sh (defaults to "api-admin"). NO rewrite:
    # the backend routes are literally /admin/*. X-Forwarded-Proto propagated.
    location /admin/ {
        proxy_pass http://${ADMIN_API_HOST}:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP         $remote_addr;
    }
}
