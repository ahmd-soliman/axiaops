# HTTP-only — TLS termination is the edge proxy's job in every environment
# the dashboard ships into:
#   • dev-1 / dev-2 / staging on the on-prem host: external reverse proxy
#     terminates TLS, forwards plain HTTP to this container on port 80.
#   • production (ECS Express ALB / customer-side k8s ingress): same shape —
#     edge terminates TLS, sends HTTP to this container.
#   • make start-staging (local dev): plain HTTP at http://localhost:8082;
#     no edge proxy locally, so the cookie is non-Secure on that path.
#
# This container does NOT terminate TLS itself. Earlier revisions had a
# 443/SSL listener that mounted mkcert certs for `make start-staging`; that
# created a latent landmine for on-prem deploys (no cert volume → nginx
# refuses to start). Edge-only TLS removes the asymmetry.
#
# Cookie posture: the api's Secure-cookie decision (services/api/internal/
# auth/cookie.go) reads X-Forwarded-Proto from the proxied request. We
# propagate whatever the edge sent rather than hardcoding "https" — a
# direct plain-HTTP hit at this container produces a non-Secure cookie
# that round-trips correctly; an edge-terminated HTTPS hit produces a
# Secure cookie. The previous hardcoded "https" lied to the api on direct
# HTTP access and produced a Secure cookie the browser refused to send back.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Real-client-IP recovery behind a multi-hop trusted proxy chain.
    #
    # Topology we see in self-hosted: client → [edge reverse proxy chain] →
    # this nginx → api. Each hop appends its $remote_addr to X-Forwarded-For
    # (standard nginx / proxy behaviour). Without the real_ip module below,
    # this nginx's $remote_addr is the *adjacent* proxy (the edge proxy, or the
    # docker bridge gateway when it speaks through docker NAT), and the
    # `proxy_set_header X-Real-IP $remote_addr;` lines further down would
    # ship that proxy's IP to the api — which then writes it to sessions.ip
    # and audit_log.ip_address. Forensic and rate-limit gap.
    #
    # `real_ip_recursive on` walks X-Forwarded-For from the right, skipping
    # any token that matches a set_real_ip_from range, and rewrites
    # $remote_addr (and the X-Real-IP we propagate) to the first *untrusted*
    # IP — i.e. the true client. The api's services/api/internal/httpip
    # package keeps working unchanged.
    #
    # Trusted ranges: all RFC1918 private space plus loopback. The api is
    # never directly internet-exposed in any deployment topology — the only
    # way to reach it is through the edge proxy chain — so trusting private
    # space is the correct trust boundary.
    #
    # Anti-spoof guarantee (c5d6467): a public-IP attacker who injects
    # `X-Forwarded-For: 8.8.8.8` cannot make this nginx attribute the
    # request to 8.8.8.8 — the recursive walk goes right-to-left and stops
    # at the first non-private token, which is the attacker's real public
    # peer (appended by the legit edge proxy). Adversarial RFC1918 tokens
    # planted further left are never reached. The only way the walk can be
    # influenced is from inside the trusted private network — i.e. the
    # caller already has LAN access, which is not a new threat.
    #
    # Known forensic edge: legitimate clients whose own source address is
    # RFC1918 (site-to-site VPNs, private-link customers) appear as
    # trusted tokens and get skipped past, so `$remote_addr` may land on
    # an upstream proxy rather than the VPN client's address. This loses
    # fidelity in logs but is not exploitable.
    #
    # 172.16.0.0/12 covers Docker's default bridge networks (172.17.0.0/16
    # on docker0, 172.18+.0.0/16 for compose-created bridges) so dashboard
    # nginx trusts the edge proxy even when reached through host-port NAT.
    #
    # Prod scope note: in production the dashboard is NOT this nginx container —
    # deploy:production ships the Vite bundle to S3 + CloudFront (arch-free,
    # serverless), so this config only runs on self-hosted dev/staging
    # deployments behind a reverse proxy. The api itself runs as an ECS Express gateway
    # service in prod; if a containerised dashboard edge is ever reintroduced in
    # front of it, the RFC1918 ranges below cover the ALB→container hop — verify
    # via sessions.ip / audit_log.ip_address that no AWS-public address leaks in.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    set_real_ip_from  127.0.0.1/32;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Security headers (audit H-5). `always` so 4xx/5xx responses carry them
    # too — a 401 without these would still be framable. CSP keeps script
    # origins to self only; the Vite bundle does not load remote scripts.
    # 'unsafe-inline' on style-src is needed for emotion / runtime CSS-in-JS
    # the dashboard uses; if that goes away, tighten to 'self' (or hash).
    # HSTS: the dashboard ships over HTTPS in every real env (the edge proxy /
    # App Runner terminate TLS); a 1y header prevents downgrade on the next
    # visit. frame-ancestors 'none' blocks clickjacking; X-Frame-Options is
    # the legacy mirror for old browsers.
    add_header X-Content-Type-Options "nosniff"                                                                            always;
    add_header Permissions-Policy   "geolocation=(), camera=(), microphone=(), payment=()"                                  always;
    add_header X-Frame-Options        "DENY"                                                                               always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"                                                    always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"                                             always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Serve the SPA — all routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # runtime-env.js + theme-boot.js are the two un-fingerprinted scripts
    # served at fixed paths from docroot. runtime-env.js is rewritten by
    # inject-env.sh per deploy; theme-boot.js carries the synchronous
    # theme-resolution IIFE. Neither gets a content hash in its filename
    # (unlike /assets/* which Vite fingerprints), so a stale cached copy
    # would silently run old logic after a redeploy. Disable caching for
    # both. The fingerprinted bundles under /assets/ keep their default
    # caching (immutable by content hash).
    #
    # nginx footgun: any add_header in this block discards ALL inherited
    # add_header directives from the server scope. Repeat every security
    # header so these files still ship with CSP / HSTS / etc.
    location = /runtime-env.js {
        add_header X-Content-Type-Options "nosniff"                                                                            always;
        add_header Permissions-Policy   "geolocation=(), camera=(), microphone=(), payment=()"                                  always;
        add_header X-Frame-Options        "DENY"                                                                               always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"                                                    always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"                                             always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control          "no-store"                                                                            always;
    }
    location = /theme-boot.js {
        add_header X-Content-Type-Options "nosniff"                                                                            always;
        add_header Permissions-Policy   "geolocation=(), camera=(), microphone=(), payment=()"                                  always;
        add_header X-Frame-Options        "DENY"                                                                               always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"                                                    always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"                                             always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control          "no-store"                                                                            always;
    }

    # SSO ceremony endpoints — browser-redirect targets, NOT SPA XHR.
    # /initiate is hit by the dashboard's email-blur 302; /callback is hit
    # by the IdP's post-auth 302. Both must reach the API directly, not
    # the SPA fallback — otherwise the IdP-registered redirect_uri can't
    # resolve to anything that runs the OIDC ceremony.
    location /v1/sso/oidc/ {
        proxy_pass http://${API_HOST}:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    # Block external scrapes of /metrics. The api's /metrics endpoint
    # carries customer_id, license expiry timing, per-organization zombie
    # counts, and per-route request rates as Prometheus labels — fine for
    # internal collectors but never for the public ingress. Internal
    # Prometheus running in the same compose network can still hit
    # `api:8080/metrics` directly via container DNS. Exact-match `=`
    # beats the prefix `/api/` block below regardless of order, but
    # ordering it first keeps the security intent visually obvious.
    location = /api/metrics {
        return 404;
    }

    # Proxy API calls to the API service. API_HOST is injected at runtime
    # via inject-env.sh (defaults to "api"). X-Forwarded-Proto is
    # propagated, NOT hardcoded — see header block above.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://${API_HOST}:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP         $remote_addr;
    }
}
