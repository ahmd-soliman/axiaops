server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the Expo SPA — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the ingestion service so the browser
    # never crosses origins — no CORS issues in production.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://ingestion:8080;
        proxy_set_header Host $host;
    }
}
