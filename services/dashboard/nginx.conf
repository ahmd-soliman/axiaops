# HTTP listener — exists only to redirect to HTTPS. We don't serve any
# real traffic over plain HTTP; the API's session cookie is `Secure`
# (derived from X-Forwarded-Proto: https set on the proxy_pass below),
# so HTTP requests would be useless anyway.
server {
    listen 80;
    server_name _;

    # 301 forwards the method + body for GET; for POSTs the browser
    # converts to GET on a 301, so the redirect form-resubmits via
    # 308 instead.
    return 308 https://$host$request_uri;
}

# HTTPS listener — TLS terminator for the local stack. Cert + key are
# mounted into /etc/nginx/certs at container start (operator runs
# `make tls-certs` once on their machine to generate them via mkcert).
# In production this same role is filled by App Runner / the
# customer's nginx-with-real-certs.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    # Modern profile only — no need to support legacy clients in dev.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the SPA — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the API service. X-Forwarded-Proto: https is
    # set so the API's cookie helper (services/api/internal/auth/cookie.go)
    # marks the session cookie Secure, matching the actual edge protocol.
    # API_HOST is injected at runtime via inject-env.sh (defaults to "api").
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://${API_HOST}:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP         $remote_addr;
    }
}
