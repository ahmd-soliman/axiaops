server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the SPA — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the API service so the browser
    # never crosses origins — no CORS issues in production.
    # API_HOST is injected at runtime via inject-env.sh (defaults to "api").
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://${API_HOST}:8080;
        proxy_set_header Host $host;
    }
}
