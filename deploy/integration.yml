services:
  redis:
    image: valkey/valkey:8.1-alpine
    container_name: axiaops-valkey-integration
    restart: unless-stopped
    # requirepass — see docs/c1-hmac-plan.md §12 Q7. REDIS_PASSWORD MUST
    # be set as a CI variable scoped to the `integration` environment.
    command:
      - valkey-server
      - --requirepass
      - ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default-network

  ingestion:
    image: axiaops-ingestion:integration
    container_name: axiaops-ingestion-integration
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUNTIME_ADMIN_DATABASE_URL: ${RUNTIME_ADMIN_DATABASE_URL}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-60s}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Audit H-2 (tracked, NOT yet implemented): METRICS_BEARER_TOKEN is
      # currently a no-op. GET /metrics has no runtime auth check today —
      # it's still listed in publicPath() (services/api/internal/middleware/
      # auth.go) and registered unauthenticated in services/ingestion/cmd/
      # main.go. Setting this variable does NOT gate the endpoint yet; the
      # slot exists so the follow-up that adds real bearer-token enforcement
      # doesn't also need a CI-variable change. Until then, /metrics is
      # reachable without auth in every env, including this one.
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      REDIS_URL: ${REDIS_URL}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # C-1: ingestion-side HMAC verifier. Required on integration (pre-release
      # smoke). Optional `_NEXT` slot stages new value during rotation.
      INGESTION_SHARED_SECRET: ${INGESTION_SHARED_SECRET}
      INGESTION_SHARED_SECRET_NEXT: ${INGESTION_SHARED_SECRET_NEXT:-}
      INGESTION_HMAC_SOFT_ENFORCE: ${INGESTION_HMAC_SOFT_ENFORCE:-false}
      APP_ENV: integration
    networks:
      - default-network

  api:
    image: axiaops-api:integration
    container_name: axiaops-api-integration
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUNTIME_ADMIN_DATABASE_URL: ${RUNTIME_ADMIN_DATABASE_URL}
      INGESTION_URL: http://axiaops-ingestion-integration:8081
      API_ADDR: ":8080"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Audit H-2 (tracked, NOT yet implemented): METRICS_BEARER_TOKEN is
      # currently a no-op. GET /metrics has no runtime auth check today —
      # it's still listed in publicPath() (services/api/internal/middleware/
      # auth.go) and registered unauthenticated in services/ingestion/cmd/
      # main.go. Setting this variable does NOT gate the endpoint yet; the
      # slot exists so the follow-up that adds real bearer-token enforcement
      # doesn't also need a CI-variable change. Until then, /metrics is
      # reachable without auth in every env, including this one.
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      REDIS_URL: ${REDIS_URL}
      # C-1: api-side HMAC signer. Same value as ingestion's current slot.
      INGESTION_SHARED_SECRET: ${INGESTION_SHARED_SECRET}
      INVITATION_TTL_DAYS: ${INVITATION_TTL_DAYS:-14}
      PUBLIC_HOST: ${PUBLIC_HOST}
      # Concrete dashboard origin per env — silences the M-3 startup warn
      # and tightens read surface for any future unauth endpoint. Set as
      # a per-env GitLab CI variable. Empty falls through to the wildcard
      # default and re-emits the warn.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      APP_ENV: integration
    # Pin DNS to the LAN resolver so split-horizon rewrites for self-hosted
    # IdPs (e.g. *.example.com) take effect inside the container.
    # Otherwise Docker's embedded DNS forwards to a public resolver, returning
    # the Cloudflare-Tunnel public IP, and the OIDC discovery fetch hits the
    # WAF instead of Keycloak. Set INTERNAL_DNS per env in CI variables;
    # falls back to 1.1.1.1 if unset (which reproduces the bug, but keeps
    # non-LAN names like AWS APIs resolving).
    dns:
      - ${INTERNAL_DNS:-1.1.1.1}
      - 1.1.1.1
    # The api writes the first-owner install token to /var/run/axiaops/
    # on first boot (BOOTSTRAP_TOKEN_FILE_PATH default). Without a named
    # volume the file lives on the container's writable layer and dies
    # with the container — meaning a redeploy before redemption locks the
    # env into a sealed-but-unbootstrappable state (the singleton row in
    # bootstrap_state remains but the plaintext is gone).
    volumes:
      - bootstrap-token:/var/run/axiaops
    networks:
      - default-network

  dashboard:
    image: axiaops-dashboard:integration
    container_name: axiaops-dashboard-integration
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      API_HOST: axiaops-api-integration
      DEV_MODE: "false"
      DEV_ORG_NAME: ""
      AXIAOPS_AWS_ACCOUNT_ID: ${AXIAOPS_AWS_ACCOUNT_ID:-123456789012}
    networks:
      - default-network

volumes:
  # First-owner install token survives container churn. See api.volumes.
  bootstrap-token:

networks:
  # Per-env network created by self-hosted-infra on the axiaops-integration host.
  # Literal key + explicit `name:` matches the pattern in deploy/dev.yml so
  # future preview/demo compose files have one shape to copy. Even though
  # integration's name doesn't depend on a variable today, the consistency
  # makes refactors safer.
  default-network:
    external: true
    name: axiaops-integration-network
