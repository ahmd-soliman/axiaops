services:
  ingestion:
    image: axiaops-ingestion:dev
    container_name: axiaops-ingestion-dev
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-60s}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      KINDE_ISSUER: ${KINDE_ISSUER}
      KINDE_CLIENT_ID: ${KINDE_CLIENT_ID}
      KINDE_CLIENT_SECRET: ${KINDE_CLIENT_SECRET}
    networks:
      - gitlab-cloud-runner-network

  api:
    image: axiaops-api:dev
    container_name: axiaops-api-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      INGESTION_URL: http://axiaops-ingestion-dev:8081
      API_ADDR: ":8080"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      KINDE_ISSUER: ${KINDE_ISSUER}
      KINDE_CLIENT_ID: ${KINDE_CLIENT_ID}
      KINDE_CLIENT_SECRET: ${KINDE_CLIENT_SECRET}
    networks:
      - gitlab-cloud-runner-network

networks:
  gitlab-cloud-runner-network:
    external: true
