services:
  redis:
    image: valkey/valkey:8.1-alpine
    container_name: axiaops-valkey-${DEPLOY_ENV}
    restart: unless-stopped
    # requirepass closes the intra-LAN trust gap flagged in §12 Q7 of
    # docs/c1-hmac-plan.md: any process on the docker network could
    # otherwise LPUSH a forged scan job. REDIS_PASSWORD must be set as a
    # per-env CI variable. Empty falls back to no password (dev hosts are
    # DEV_MODE=true so this is acceptable here; deployed-with-auth envs
    # like preview/staging/demo set it).
    command:
      - valkey-server
      - --requirepass
      - ${REDIS_PASSWORD:-}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default-network

  ingestion:
    image: axiaops-ingestion:${DEPLOY_ENV}
    container_name: axiaops-ingestion-${DEPLOY_ENV}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-60s}
      DEV_MODE: ${DEV_MODE:-true}
      DEV_ORGANIZATION_ID: ${DEV_ORGANIZATION_ID:-dev-organization-axiaops}
      # Required. Set per-env in GitLab CI (File-type var scoped to dev-1/dev-2).
      # No fallback by design — a committed default would let any repo-reader
      # decrypt accounts.secret_encrypted on the dev hosts. Matches the
      # staging/preview/demo manifest shape.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Text logs match dev-1/dev-2's "fast inspection over SSH" use case.
      # After 8cbf35a logging.go no longer infers text from DEV_MODE — set
      # LOG_OUTPUT explicitly here. Override to `json` if needed.
      LOG_OUTPUT: ${LOG_OUTPUT:-text}
      # REDIS_URL carries the password via userinfo when REDIS_PASSWORD is
      # set: redis://:<pw>@host:port. Empty REDIS_PASSWORD falls back to
      # unauthenticated — fine on dev-1/dev-2 (DEV_MODE=true).
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-}@axiaops-valkey-${DEPLOY_ENV}:6379}
      # C-1: ingestion-side HMAC verifier. DEV_MODE allows empty — same
      # default as ENCRYPTION_KEY's posture here. Production envs (preview/
      # staging/demo) set this via CI variables. Optional `_NEXT` slot
      # stages the new value during a zero-downtime rotation.
      INGESTION_SHARED_SECRET: ${INGESTION_SHARED_SECRET:-}
      INGESTION_SHARED_SECRET_NEXT: ${INGESTION_SHARED_SECRET_NEXT:-}
      INGESTION_HMAC_SOFT_ENFORCE: ${INGESTION_HMAC_SOFT_ENFORCE:-false}
      APP_ENV: ${DEPLOY_ENV}
    networks:
      - default-network

  api:
    image: axiaops-api:${DEPLOY_ENV}
    container_name: axiaops-api-${DEPLOY_ENV}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      INGESTION_URL: http://axiaops-ingestion-${DEPLOY_ENV}:8081
      API_ADDR: ":8080"
      DEV_MODE: ${DEV_MODE:-true}
      DEV_ORGANIZATION_ID: ${DEV_ORGANIZATION_ID:-dev-organization-axiaops}
      # Required. See ingestion service above for rationale.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # See ingestion service above for rationale.
      LOG_OUTPUT: ${LOG_OUTPUT:-text}
      # See ingestion service above — same REDIS_URL shape.
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-}@axiaops-valkey-${DEPLOY_ENV}:6379}
      # C-1: api-side HMAC signer. Same value as the ingestion side.
      INGESTION_SHARED_SECRET: ${INGESTION_SHARED_SECRET:-}
      PUBLIC_HOST: ${PUBLIC_HOST}
      # Concrete dashboard origin per env — silences the M-3 startup warn
      # when DEV_MODE is flipped off for SSO testing. Wildcard is fine
      # under the default DEV_MODE=true (warn check is gated on !DevMode),
      # but plumbing the variable here means operators don't have to edit
      # the manifest when they flip DEV_MODE.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      APP_ENV: ${DEPLOY_ENV}
      # ── Invite-email relay (global SMTP fallback for the InviteMailer) ──
      # Project-level CI variables (environment_scope: *), NOT per-env: the
      # same relay mailbox serves every env including prod, so they're set
      # once at the project level. Only SMTP_PASS is masked; the rest are
      # non-secret. Empty SMTP_HOST ⇒ no global mailer (invite delivery then
      # falls back to a per-org email channel) — so this block is a safe no-op
      # until the CI variables are populated. Wired into deploy/dev.yml first
      # to validate deliverability on dev-1/dev-2 before preview/staging/demo
      # + prod adopt the same block. Needs PUBLIC_HOST set on the env for the
      # redemption URL to be absolute (else email_delivery=skipped_no_public_host).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-AxiaOps}
    # The api writes the first-owner install token to /var/run/axiaops/
    # on first boot (BOOTSTRAP_TOKEN_FILE_PATH default). Without a named
    # volume the file lives on the container's writable layer and dies
    # with the container — meaning a redeploy before redemption locks the
    # env into a sealed-but-unbootstrappable state (the singleton row in
    # bootstrap_state remains but the plaintext is gone). DEV_MODE skips
    # the bootstrap path entirely, but the mount is harmless and stays
    # consistent across deploy/*.yml.
    volumes:
      - bootstrap-token:/var/run/axiaops
    networks:
      - default-network

  dashboard:
    image: axiaops-dashboard:${DEPLOY_ENV}
    container_name: axiaops-dashboard-${DEPLOY_ENV}
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      API_HOST: axiaops-api-${DEPLOY_ENV}
      DEV_MODE: "true"
      DEV_ORG_NAME: ${DEV_ORG_NAME:-AxiaOps Dev}
      AXIAOPS_AWS_ACCOUNT_ID: ${AXIAOPS_AWS_ACCOUNT_ID:-}
    networks:
      - default-network

volumes:
  # First-owner install token survives container churn. See api.volumes.
  bootstrap-token:

networks:
  # Per-env network created by self-hosted-infra on each axiaops-${DEPLOY_ENV} host
  # (one host = one dev environment, so ports don't collide across envs).
  #
  # Literal compose-internal key (`default-network`) + dynamic external `name`:
  # docker-compose v2 does not reliably substitute ${VAR} in `networks:` map
  # keys (only in scalar values), so a key like `axiaops-${DEPLOY_ENV}-network`
  # stays literal at the top level while service references substitute as
  # expected — producing the symptom `service "X" refers to undefined network
  # axiaops-dev-1-network: invalid compose project` even though the network
  # exists on the daemon. The fix: a literal key (no substitution required)
  # plus an explicit `name:` field, which IS substituted reliably and is
  # what compose passes to the docker daemon for lookup.
  default-network:
    external: true
    name: axiaops-${DEPLOY_ENV}-network
