services:
  ingestion:
    image: axiaops-ingestion:dev
    container_name: axiaops-ingestion-dev
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://axiaops:axiaops@axiaops-dev-db:5432/axiaops?sslmode=disable}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgres://axiaops_owner:axiaops_owner@axiaops-dev-db:5432/axiaops?sslmode=disable}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-60s}
      DEV_MODE: ${DEV_MODE:-true}
      DEV_TENANT_ID: ${DEV_TENANT_ID:-dev-tenant-axiaops}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-5f67e3efd16e96eee4afd01d27d98e1f1a11aa226312d0147ff566108ee8819a}
    networks:
      - gitlab-cloud-runner-network

  api:
    image: axiaops-api:dev
    container_name: axiaops-api-dev
    restart: unless-stopped
    ports:
      - "30031:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://axiaops:axiaops@axiaops-dev-db:5432/axiaops?sslmode=disable}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgres://axiaops_owner:axiaops_owner@axiaops-dev-db:5432/axiaops?sslmode=disable}
      INGESTION_URL: http://axiaops-ingestion-dev:8081
      API_ADDR: ":8080"
      DEV_MODE: ${DEV_MODE:-true}
      DEV_TENANT_ID: ${DEV_TENANT_ID:-dev-tenant-axiaops}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-5f67e3efd16e96eee4afd01d27d98e1f1a11aa226312d0147ff566108ee8819a}
    networks:
      - gitlab-cloud-runner-network

  dashboard:
    image: axiaops-dashboard:dev
    container_name: axiaops-dashboard-dev
    restart: unless-stopped
    ports:
      - "30032:80"
    environment:
      DEV_MODE: "true"
      DEV_ORG_NAME: ${DEV_ORG_NAME:-AxiaOps Dev}
    networks:
      - gitlab-cloud-runner-network

networks:
  gitlab-cloud-runner-network:
    external: true
