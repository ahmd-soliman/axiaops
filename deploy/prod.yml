services:
  ingestion:
    image: axiaops-ingestion:prod
    container_name: axiaops-ingestion-prod
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-1h}
      DEV_MODE: "false"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      KINDE_ISSUER: ${KINDE_ISSUER}
      KINDE_CLIENT_ID: ${KINDE_CLIENT_ID}
      KINDE_CLIENT_SECRET: ${KINDE_CLIENT_SECRET}
      LOG_OUTPUT: json
      LOG_LEVEL: info
    networks:
      - axiaops-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    image: axiaops-api:prod
    container_name: axiaops-api-prod
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      INGESTION_URL: http://axiaops-ingestion-prod:8081
      API_ADDR: ":8080"
      DEV_MODE: "false"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      KINDE_ISSUER: ${KINDE_ISSUER}
      KINDE_CLIENT_ID: ${KINDE_CLIENT_ID}
      KINDE_CLIENT_SECRET: ${KINDE_CLIENT_SECRET}
      LOG_OUTPUT: json
      LOG_LEVEL: info
    networks:
      - axiaops-network
    depends_on:
      ingestion:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  axiaops-network:
    external: false
