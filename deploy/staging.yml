services:
  redis:
    image: redis:7-alpine
    container_name: axiaops-redis-staging
    restart: unless-stopped
    networks:
      - default-network

  ingestion:
    image: axiaops-ingestion:staging
    container_name: axiaops-ingestion-staging
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-60s}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # 30-day non-prod license minted by mint:license:staging (CI). Required
      # for pre-release scan smoke; without it the post-amendment scan-gate
      # 403s license_not_loaded.
      AXIAOPS_LICENSE: ${AXIAOPS_LICENSE}
      REDIS_URL: ${REDIS_URL}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    networks:
      - default-network

  api:
    image: axiaops-api:staging
    container_name: axiaops-api-staging
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      INGESTION_URL: http://axiaops-ingestion-staging:8081
      API_ADDR: ":8080"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AXIAOPS_LICENSE: ${AXIAOPS_LICENSE}
      REDIS_URL: ${REDIS_URL}
      INVITATION_TTL_DAYS: ${INVITATION_TTL_DAYS:-14}
      PUBLIC_HOST: ${PUBLIC_HOST}
      # Concrete dashboard origin per env — silences the M-3 startup warn
      # and tightens read surface for any future unauth endpoint. Set as
      # a per-env GitLab CI variable. Empty falls through to the wildcard
      # default and re-emits the warn.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    # Pin DNS to the LAN resolver so split-horizon rewrites for self-hosted
    # IdPs (e.g. *.example.com) take effect inside the container.
    # Otherwise Docker's embedded DNS forwards to a public resolver, returning
    # the Cloudflare-Tunnel public IP, and the OIDC discovery fetch hits the
    # WAF instead of Keycloak. Set INTERNAL_DNS per env in CI variables;
    # falls back to 1.1.1.1 if unset (which reproduces the bug, but keeps
    # non-LAN names like AWS APIs resolving).
    dns:
      - ${INTERNAL_DNS:-1.1.1.1}
      - 1.1.1.1
    # The api writes the first-owner install token to /var/run/axiaops/
    # on first boot (BOOTSTRAP_TOKEN_FILE_PATH default). Without a named
    # volume the file lives on the container's writable layer and dies
    # with the container — meaning a redeploy before redemption locks the
    # env into a sealed-but-unbootstrappable state (the singleton row in
    # bootstrap_state remains but the plaintext is gone).
    volumes:
      - bootstrap-token:/var/run/axiaops
    networks:
      - default-network

  dashboard:
    image: axiaops-dashboard:staging
    container_name: axiaops-dashboard-staging
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      API_HOST: axiaops-api-staging
      DEV_MODE: "false"
      DEV_ORG_NAME: ""
      AXIAOPS_AWS_ACCOUNT_ID: ${AXIAOPS_AWS_ACCOUNT_ID:-123456789012}
    networks:
      - default-network

volumes:
  # First-owner install token survives container churn. See api.volumes.
  bootstrap-token:

networks:
  # Per-env network created by self-hosted-infra on the axiaops-staging host.
  # Literal key + explicit `name:` matches the pattern in deploy/dev.yml so
  # future preview/demo compose files have one shape to copy. Even though
  # staging's name doesn't depend on a variable today, the consistency
  # makes refactors safer.
  default-network:
    external: true
    name: axiaops-staging-network
