services:
  ingestion:
    image: axiaops-ingestion:staging
    container_name: axiaops-ingestion-staging
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-60s}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      KINDE_ISSUER: ${KINDE_ISSUER:-https://axiaops.kinde.com}

      KINDE_CLIENT_ID: ${KINDE_CLIENT_ID:-7e07b95e4d2c45afad5f88a0fa8ebcba}

      KINDE_CLIENT_SECRET: ${KINDE_CLIENT_SECRET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
    networks:
      - gitlab-cloud-runner-network

  api:
    image: axiaops-api:staging
    container_name: axiaops-api-staging
    restart: unless-stopped
    ports:
      - "30041:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      INGESTION_URL: http://axiaops-ingestion-staging:8081
      API_ADDR: ":8080"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      KINDE_ISSUER: ${KINDE_ISSUER}
      KINDE_CLIENT_ID: ${KINDE_CLIENT_ID}
      KINDE_CLIENT_SECRET: ${KINDE_CLIENT_SECRET}
    networks:
      - gitlab-cloud-runner-network

  dashboard:
    image: axiaops-dashboard:staging
    container_name: axiaops-dashboard-staging
    restart: unless-stopped
    ports:
      - "30042:80"
    networks:
      - gitlab-cloud-runner-network

networks:
  gitlab-cloud-runner-network:
    external: true
