{{/*
Traefik IngressRoute template -- opt-in via traefikIngressRoute.enabled.
Assumes Traefik ingress controller and traefik.io/v1alpha1 CRD are available.
*/}}
{{- if .Values.traefikIngressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "axiaops.fullname" . }}
  labels:
    {{- include "axiaops.labels" . | nindent 4 }}
  {{- with .Values.traefikIngressRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- toYaml .Values.traefikIngressRoute.entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ .Values.traefikIngressRoute.host | default .Values.publicHost }}`)
      kind: Rule
      services:
        - name: {{ include "axiaops.fullname" . }}-dashboard
          port: 80
{{- end }}
