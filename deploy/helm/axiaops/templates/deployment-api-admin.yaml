apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "axiaops.apiAdminHost" . }}
  labels:
    {{- include "axiaops.componentLabels" (dict "context" . "component" "api-admin") | nindent 4 }}
spec:
  replicas: {{ .Values.apiAdmin.replicaCount }}
  selector:
    matchLabels:
      {{- include "axiaops.componentSelectorLabels" (dict "context" . "component" "api-admin") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "axiaops.componentSelectorLabels" (dict "context" . "component" "api-admin") | nindent 8 }}
      {{- with .Values.apiAdmin.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api-admin
          image: {{ include "axiaops.apiAdminImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ADMIN_API_ADDR
              value: ":8080"
            - name: APP_ENV
              value: {{ .Values.env | quote }}
            - name: LOG_OUTPUT
              value: "json"
            {{- if .Values.redis.enabled }}
            {{- if .Values.redis.auth.existingSecret }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.auth.existingSecret }}
                  key: redis-url
            {{- else }}
            - name: REDIS_URL
              value: "redis://{{ include "axiaops.redisHost" . }}:6379"
            {{- end }}
            {{- end }}
            {{- if .Values.postgres.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: database-url
            # api-admin has NO DEV_MODE bypass -- staff auth is always real,
            # so it dies() at boot without this even on a DEV_MODE-enabled
            # environment. See deploy/dev.yml's api-admin block comment.
            - name: RUNTIME_ADMIN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: runtime-admin-database-url
            {{- end }}
            {{- if .Values.secrets.existingSecret }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: encryption-key
            {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
          {{- with .Values.apiAdmin.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "axiaops.apiAdminHost" . }}
  labels:
    {{- include "axiaops.componentLabels" (dict "context" . "component" "api-admin") | nindent 4 }}
spec:
  selector:
    {{- include "axiaops.componentSelectorLabels" (dict "context" . "component" "api-admin") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
