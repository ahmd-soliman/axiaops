{{/*
Plain networking.k8s.io/v1 Ingress -- portable to any controller. Assumes
TLS termination happens at an edge proxy outside the cluster and this does
plain-HTTP Host-based routing only. If pointed at a controller that DOES
want in-cluster TLS, set ingress.tls.enabled + ingress.tls.secretName.
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "axiaops.fullname" . }}
  labels:
    {{- include "axiaops.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- if .Values.ingress.host }}
        - {{ .Values.ingress.host | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    {{- if .Values.ingress.host }}
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "axiaops.fullname" . }}-dashboard
                port:
                  name: http
    {{- end }}
{{- end }}
