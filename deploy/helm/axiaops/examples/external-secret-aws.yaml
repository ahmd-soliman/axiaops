# Example ExternalSecret manifests wiring this chart's two required Secrets
# (axiaops-postgres, axiaops-secrets) from AWS Secrets Manager via the
# External Secrets Operator (ESO), instead of `kubectl create secret`.
#
# This is illustrative only -- never applied by the chart itself. The
# chart's own design principle is "bring your own Secret" (see
# values.yaml): it has no secret-generation or secret-management opinion
# baked in. Copy/adapt this into your own GitOps repo alongside wherever
# you already keep this environment's ArgoCD Application / Flux
# Kustomization -- same split as this repo's own deploy/helm/axiaops/README.md
# "Installing" section describes for the chart values themselves.
#
# Why ESO over `kubectl create secret` for a real AWS deployment: RDS can
# manage/rotate its own master password in Secrets Manager natively, and
# ESO keeps the Kubernetes Secret in sync with whatever's in Secrets
# Manager on a schedule -- no plaintext password ever typed into a
# terminal or committed anywhere, and rotation doesn't require a manual
# `kubectl` step.
#
# Prerequisites (not shown here, cluster/account-specific):
#   - External Secrets Operator installed on the cluster.
#   - A ClusterSecretStore named "aws-secrets-manager" already configured
#     with IRSA (IAM Roles for Service Accounts) scoped to read only the
#     two secret ARNs below -- see
#     https://external-secrets.io/latest/provider/aws-secrets-manager/
#   - The AWS secrets themselves created ahead of time as JSON objects
#     whose keys match what this chart expects, e.g.:
#       aws secretsmanager create-secret --name axiaops/prod/postgres \
#         --secret-string '{
#           "database-url": "postgres://axiaops:...@host:5432/axiaops?sslmode=verify-full",
#           "migration-database-url": "postgres://axiaops_owner:...@host:5432/axiaops?sslmode=verify-full",
#           "runtime-admin-database-url": "postgres://axiaops_runtime:...@host:5432/axiaops?sslmode=verify-full"
#         }'
#       aws secretsmanager create-secret --name axiaops/prod/app-secrets \
#         --secret-string '{
#           "encryption-key": "'"$(openssl rand -hex 32)"'",
#           "ingestion-shared-secret": "'"$(openssl rand -hex 32)"'"
#         }'
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: axiaops-postgres
  namespace: axiaops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: axiaops-postgres # matches postgres.existingSecret in values.yaml
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: axiaops/prod/postgres
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: axiaops-secrets
  namespace: axiaops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: axiaops-secrets # matches secrets.existingSecret in values.yaml
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: axiaops/prod/app-secrets
