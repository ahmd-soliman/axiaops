name: ci

# Converted from .gitlab-ci.yml's test/integration/e2e/build stages for the
# open-source release. Deliberately excludes:
#   - the deploy stage — internal deploy targets not applicable to an OSS
#     repo with no equivalent infrastructure here.
#   - test:dashboard-admin and build:admin-images — the admin plane
#     (api-admin/dashboard-admin, staff console) is out of scope for a
#     self-hosted single-org install.
# Everything else keeps the same shape: same Makefile targets, same service
# containers, same Go/Node versions. Images build and push to GHCR instead
# of the GitLab Container Registry.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}
  POSTGRES_PASSWORD: axiaops
  POSTGRES_OWNER_PASSWORD: axiaops_owner
  GOPROXY: "https://proxy.golang.org,direct"

jobs:
  # Every job below is a required status check on main (branch protection),
  # so this can't be a `paths-ignore` on the workflow itself -- that would
  # leave required checks permanently unreported for docs/terraform-only
  # PRs and block them from merging forever. Instead: this job always runs
  # (cheap, no checkout of build tooling) and the five root jobs below gate
  # on its output. GitHub cascades a skipped job through `needs:` chains
  # automatically (a job's default `if` requires its dependencies to have
  # *succeeded*, not just completed, so a skipped test-unit/lint/etc. skips
  # test-integration-api/ingestion, verify-production-build, e2e-regression,
  # and publish-images in turn, with no extra `if:` needed on any of them) --
  # a skipped required check still satisfies branch protection.
  #
  # Defaults to running full CI whenever anything outside the known-safe
  # paths changed. Uses dorny/paths-filter (pinned to the v4.0.3 release
  # commit) rather than a hand-rolled git diff -- it already handles the
  # pull_request (GitHub API, no checkout needed) vs push-to-main (git,
  # diffed against the prior commit on the same branch) cases correctly on
  # its own, including its own merge-base-search fetch depth, so this job
  # doesn't need to reimplement any of that.
  #
  # NOTE: a filter made only of negated ('!...') patterns never matches
  # anything (documented paths-filter gotcha) -- '**' is the catch-all
  # inclusion pattern here, and predicate-quantifier: some-with-excludes is
  # what makes the '!'-prefixed lines actually exclude.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      grafana: ${{ steps.filter.outputs.grafana }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: "some-with-excludes"
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!website/**'
              - '!terraform/**'
              - '!README.md'
              - '!CHANGELOG.md'
              - '!CLAUDE.md'
              - '!services/*/CLAUDE.md'
              - '!deploy/observability/**'
            grafana:
              - 'deploy/observability/grafana-dashboard.json'
            helm:
              - 'deploy/helm/axiaops/**'

  test-unit:
    needs: changes
    if: failure() || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/shared/go.sum
            services/api/go.sum
            services/ingestion/go.sum
      - run: cd services/shared && go test ./... -count=1 -v -p=4
      - run: cd services/api && go test ./... -count=1 -v -p=4
      - run: cd services/ingestion && go test ./... -count=1 -v -p=4

  test-redis:
    needs: changes
    if: failure() || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: "redis://localhost:6379"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/shared/go.sum
            services/api/go.sum
            services/ingestion/go.sum
      - run: cd services/shared && go test ./cache ./queue -count=1 -v

  test-dashboard:
    needs: changes
    if: failure() || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/dashboard/package-lock.json
      - run: cd services/dashboard && npm ci && npm run test:run

  test-storage:
    needs: changes
    if: failure() || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: axiaops
          POSTGRES_USER: axiaops_owner
          POSTGRES_PASSWORD: axiaops_owner
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: "postgres://axiaops_owner:axiaops_owner@localhost:5432/axiaops?sslmode=disable"
      DATABASE_URL: "postgres://axiaops:axiaops@localhost:5432/axiaops?sslmode=disable"
      RUNTIME_ADMIN_DATABASE_URL: "postgres://axiaops_runtime:axiaops_runtime@localhost:5432/axiaops?sslmode=disable"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/shared/go.sum
            services/api/go.sum
            services/ingestion/go.sum
      - run: cd services/shared && go test ./storage/postgres/... -count=1 -v -p=1

  lint:
    needs: changes
    if: failure() || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/shared/go.sum
            services/api/go.sum
            services/ingestion/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: services/shared
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: services/api
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: services/ingestion
      - name: DEV_MODE convention guard
        run: |
          hits=$(grep -rn 'os\.Getenv("DEV_MODE")' services/ --include="*.go" \
            | grep -vE '^services/(api|ingestion)/cmd/devmode_dev\.go:' || true)
          if [ -n "$hits" ]; then
            echo "DEV_MODE convention violation — direct os.Getenv read outside the helper:" >&2
            echo "$hits" >&2
            exit 1
          fi
      - run: ./scripts/check-migration-search-path.sh

  # Excluded from the `code` filter above (nothing in test-unit/lint/
  # integration/e2e touches this file), so a dashboard-only change would
  # otherwise merge with zero validation. jq empty parses the file and
  # discards the output -- exits non-zero with a pointer at the bad byte
  # on malformed JSON, silent success otherwise.
  validate-grafana-dashboard:
    needs: changes
    if: failure() || needs.changes.outputs.grafana == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: jq empty deploy/observability/grafana-dashboard.json

  # deploy/helm/axiaops is the customer-facing install path (docs/
  # deployment guides), but it's Go-template YAML -- nothing in
  # test-unit/lint/integration/e2e renders it, and deploy-pages.yml only
  # `helm package`s it on push to main (no pull_request trigger, and
  # package doesn't render templates). This is the only check that
  # actually renders the chart before merge.
  helm-lint:
    needs: changes
    if: failure() || needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/axiaops
      - run: helm template deploy/helm/axiaops > /dev/null

  test-integration-api:
    runs-on: ubuntu-latest
    needs: [test-unit, test-redis, test-storage, lint]
    steps:
      - uses: actions/checkout@v5
      - run: make test-integration-api
      - run: make test-integration-sso
      - if: failure()
        run: |
          cd test-infra/integration
          for svc in migrate init-organization api ingestion; do
            echo "--- logs $svc ---"
            docker compose logs --no-color --tail=200 "$svc" || true
          done
      - if: always()
        run: |
          cd test-infra/integration
          docker compose down -v --remove-orphans || true

  test-integration-ingestion:
    runs-on: ubuntu-latest
    needs: [test-unit, test-redis, test-storage, lint]
    steps:
      - uses: actions/checkout@v5
      - run: make test-integration-ingestion
      - if: failure()
        run: |
          cd test-infra/integration
          for svc in migrate init-organization api ingestion; do
            echo "--- logs $svc ---"
            docker compose logs --no-color --tail=200 "$svc" || true
          done
      - if: always()
        run: |
          cd test-infra/integration
          docker compose down -v --remove-orphans || true

  verify-production-build:
    runs-on: ubuntu-latest
    needs:
      - test-unit
      - lint
      - test-integration-api
      - test-integration-ingestion
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/shared/go.sum
            services/api/go.sum
            services/ingestion/go.sum
      - run: make build-production
      - run: cd services/api && go test -tags production ./cmd/
      - run: cd services/ingestion && go test -tags production ./cmd/

  e2e-regression:
    runs-on: ubuntu-latest
    needs:
      - test-unit
      - lint
      - test-integration-api
      - test-integration-ingestion
    continue-on-error: true # non-blocking while the suite matures, same as GitLab
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - run: make test-e2e
      - if: failure()
        run: |
          cd test-infra/e2e
          for svc in migrate api ingestion dashboard playwright; do
            echo "--- logs $svc ---"
            docker compose logs --no-color --tail=200 "$svc" || true
          done
      - if: always()
        run: |
          cd test-infra/e2e
          docker compose down -v --remove-orphans || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            services/dashboard/playwright-report/
            services/dashboard/test-results/
          retention-days: 7

  publish-images:
    runs-on: ubuntu-latest
    needs:
      - test-unit
      - test-redis
      - test-storage
      - lint
      - test-integration-api
      - test-integration-ingestion
      - verify-production-build
      - e2e-regression
    # Only publish on main — PR builds compile-check via verify-production-build
    # and run e2e-regression without pushing to GHCR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        run: |
          TAG="main-${GITHUB_SHA::8}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # CI only ever builds and publishes the production shape (DEV_MODE
          # compiled out via BUILD_TAGS=production). The DEV_MODE-capable
          # sibling is never pushed to a public registry -- an auth-bypass
          # build has no business sitting in a public package index even
          # under a clearly-labelled tag. Anyone who wants it builds it
          # locally: `docker build -f services/api/Dockerfile .` (omit
          # BUILD_TAGS) -- see deploy/README.md.
          for svc in api ingestion; do
            docker build -t ${IMAGE_BASE}/${svc}:${TAG} \
              -f services/${svc}/Dockerfile \
              --build-arg BUILD_TAGS=production \
              --build-arg APP_VERSION=${TAG} --build-arg APP_COMMIT_SHA=${GITHUB_SHA::8} .
          done
          docker build -t ${IMAGE_BASE}/migrate:${TAG} \
            -f services/migrate/Dockerfile \
            --build-arg APP_VERSION=${TAG} --build-arg APP_COMMIT_SHA=${GITHUB_SHA::8} .
          docker build -t ${IMAGE_BASE}/dashboard:${TAG} \
            -f services/dashboard/Dockerfile services/dashboard
          docker push ${IMAGE_BASE}/api:${TAG}
          docker push ${IMAGE_BASE}/ingestion:${TAG}
          docker push ${IMAGE_BASE}/migrate:${TAG}
          docker push ${IMAGE_BASE}/dashboard:${TAG}
