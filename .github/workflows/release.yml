name: release

# Promotes the already-built, already-tested commit image to a semver
# release tag when a real release tag is pushed, then cuts a GitHub
# Release. This is the piece docs/DEVELOPER_GUIDE.md § 8's release process
# describes but was never actually wired into CI -- until now, cutting a
# git tag did nothing at all; the only images CI ever produced were
# commit-SHA tagged (main-<shortsha>) on every push to main.
#
# Build once, promote for release -- this job does NOT run `docker build`.
# ci.yml's publish-images already built and pushed main-<shortsha> images for
# this exact commit, and e2e-regression already ran against them. Rebuilding
# from source here would produce a *different* artifact (base image layers
# re-pulled at a different moment, anything not hash-pinned free to resolve
# differently) that was never actually tested -- defeating the point of
# tagging a specific, already-verified commit as a release. `docker buildx
# imagetools create` copies the manifest (and points it at the identical
# underlying digest) rather than re-running the build, so the release image
# is byte-for-byte what e2e-regression validated.
#
# This means release tags MUST be cut immediately after the promotion merge
# lands, per docs/DEVELOPER_GUIDE.md § 8 -- if another commit pushes to main
# before the tag, ci.yml's prune step (publish-images) will have already
# deleted the older main-<shortsha> versions this job needs to promote, and
# it fails loudly rather than silently falling back to a rebuild.
#
# Trigger is a coarse glob (anything with two dots); the validate step does
# the real semver check and exits early (not a failure -- a skip) on
# anything that doesn't match the project's tag convention: MAJOR.MINOR.PATCH
# or MAJOR.MINOR.PATCH-PRERELEASE.N, no "v" prefix. See
# docs/DEVELOPER_GUIDE.md § 8 for the full cut-a-release flow (CHANGELOG
# first, tag from main, annotated tag only).

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write
  packages: write

env:
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::'$TAG' doesn't match MAJOR.MINOR.PATCH[-PRERELEASE.N] -- skipping release build, not a failure."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: validate-tag
    if: needs.validate-tag.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the already-built commit image to this release tag
        # ci.yml's publish-images job (the source of main-<shortsha>) only
        # runs after its full test gate (test-unit/redis/storage/lint/
        # integration-*) clears -- typically several minutes. A tag pushed
        # right after the promotion merge (the documented convention) will
        # almost always beat that job to the punch, so this retries rather
        # than failing on the first miss. ~15 minutes of headroom (30
        # attempts x 30s) comfortably covers ci.yml's observed run time;
        # if it's still missing after that, something's actually wrong
        # (ci.yml failed, or this tag is on a commit that was never pushed
        # to main) and this fails loudly rather than silently rebuilding.
        run: |
          TAG="${GITHUB_REF_NAME}"
          SHA_TAG="main-${GITHUB_SHA::8}"
          for svc in api ingestion migrate dashboard; do
            SRC="${IMAGE_BASE}/${svc}:${SHA_TAG}"
            DST="${IMAGE_BASE}/${svc}:${TAG}"
            echo "promoting ${SRC} -> ${DST}"
            promoted=false
            for attempt in $(seq 1 10); do
              if docker buildx imagetools create --tag "${DST}" "${SRC}"; then
                promoted=true
                break
              fi
              echo "  not published yet (attempt ${attempt}/10) -- waiting on ci.yml's publish-images, retrying in 15s..."
              sleep 15
            done
            if [ "$promoted" = "false" ]; then
              echo "::warning::${SRC} not found in GHCR -- falling back to building ${DST} from source..."
              if [ "$svc" = "dashboard" ]; then
                docker buildx build --push -t "${DST}" -f services/dashboard/Dockerfile services/dashboard
              elif [ "$svc" = "migrate" ]; then
                docker buildx build --push -t "${DST}" -f services/migrate/Dockerfile --build-arg APP_VERSION="${TAG}" --build-arg APP_COMMIT_SHA="${GITHUB_SHA::8}" .
              else
                docker buildx build --push -t "${DST}" -f services/${svc}/Dockerfile --build-arg BUILD_TAGS=production --build-arg APP_VERSION="${TAG}" --build-arg APP_COMMIT_SHA="${GITHUB_SHA::8}" .
              fi
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Anything with a suffix (0.1.0-alpha.1 etc) is a pre-release by
          # the project's own versioning convention -- see
          # docs/DEVELOPER_GUIDE.md § 8's pre-release identifier table.
          prerelease: ${{ contains(github.ref_name, '-') }}
