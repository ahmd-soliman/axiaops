name: deploy-pages

# Builds and publishes two things to the same GitHub Pages site:
#   - the docs website (website/ -> Astro/Starlight build) at the site root
#   - a standard Helm chart repository (deploy/helm/axiaops packaged +
#     indexed) at /charts/, so `helm repo add axiaops
#     https://<pages-url>/charts` + `helm install axiaops axiaops/axiaops
#     --version X.Y.Z` works the same way `helm repo add traefik
#     https://traefik.github.io/charts` does.
#
# Requires GitHub Pages to actually be enabled for this repo -- which
# requires the repo to be public (or GitHub Pro+ while private). Until
# then this workflow will fail at the Pages steps; that's expected, not
# a bug. See docs/DEVELOPER_GUIDE.md / the repo's own history for context.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'deploy/helm/axiaops/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PAGES_URL: https://axiaops.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build docs site
        run: |
          cd website
          npm ci
          npm run build

      - uses: azure/setup-helm@v4

      - name: Assemble combined Pages artifact
        run: |
          mkdir -p site-out
          cp -r website/dist/. site-out/
          mkdir -p site-out/charts

          # Each Pages deploy fully replaces the previous one -- there's no
          # incremental upload -- so without this, every run would wipe out
          # every chart version except the one just packaged, breaking
          # `helm install --version <old>` for anything already published.
          # A real chart repo keeps every version ever published (same as
          # chart-releaser, Bitnami, any other real Helm chart repo), so
          # pull down whatever's already live first and let this run add to
          # it. Silently a no-op on the very first-ever run (no site to
          # fetch from yet).
          if curl -fsSL "${PAGES_URL}/charts/index.yaml" -o /tmp/old-index.yaml; then
            grep -oE 'https://[^"[:space:]]+\.tgz' /tmp/old-index.yaml | sort -u | while read -r url; do
              curl -fsSL "$url" -o "site-out/charts/$(basename "$url")"
            done
          fi

          helm package deploy/helm/axiaops -d site-out/charts
          helm repo index site-out/charts --url "${PAGES_URL}/charts"
          
          # Clean up old apiVersion: v1 entries
          yq eval 'del(.entries.axiaops[] | select(.apiVersion == "v1"))' -i site-out/charts/index.yaml

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
